<!doctype html> <!-- 声明当前文档使用 HTML5 标准。 -->
<html lang="zh-CN"> <!-- 设置页面语言为中文。 -->
<head> <!-- 开始页面头部配置。 -->
  <meta charset="UTF-8" /> <!-- 设置页面字符编码为 UTF-8。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- 设置移动端视口，保证响应式布局正常。 -->
  <title>虚拟 miniQMT 交易看板</title> <!-- 设置浏览器标签页标题。 -->
  <link rel="stylesheet" href="./styles.css" /> <!-- 加载本地构建后的 TailwindCSS 样式，避免浏览器运行时生成样式造成闪烁。 -->
</head> <!-- 结束页面头部配置。 -->
<body class="bg-slate-100 text-slate-900"> <!-- 设置页面基础背景和文字颜色。 -->
  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"> <!-- 设置页面主体最大宽度和响应式边距。 -->
    <header class="mb-6 flex flex-col gap-3 border-b border-slate-200 pb-5 sm:flex-row sm:items-end sm:justify-between"> <!-- 设置看板头部信息区域。 -->
      <div> <!-- 包裹标题和说明文字。 -->
        <p class="text-sm font-medium text-slate-500">虚拟 miniQMT 交易复盘</p> <!-- 显示页面分类说明。 -->
        <h1 class="mt-1 text-3xl font-semibold tracking-normal text-slate-950">交易批次详情</h1> <!-- 显示页面主标题。 -->
      </div> <!-- 结束标题容器。 -->
      <div class="text-sm text-slate-500"> <!-- 包裹数据时间和进程状态。 -->
        <p id="generatedAt">数据时间：加载中</p> <!-- 显示快照生成时间。 -->
        <p id="processState" class="mt-1">交易进程状态：加载中</p> <!-- 显示交易进程状态。 -->
      </div> <!-- 结束状态容器。 -->
    </header> <!-- 结束看板头部。 -->
    <section id="summaryCards" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></section> <!-- 放置账户总览指标卡片。 -->
    <section class="mt-6 rounded-lg border border-slate-200 bg-white shadow-sm"> <!-- 放置十三策略独立资金总览。 -->
      <div class="border-b border-slate-200 px-4 py-3">
        <h2 class="text-base font-semibold text-slate-950">十三策略分账总览</h2>
      </div>
      <div id="strategyCards" class="grid gap-3 p-4 sm:grid-cols-2 xl:grid-cols-5"></div>
    </section>
    <section class="mt-6 grid gap-4 lg:grid-cols-2" id="batchCards"></section> <!-- 放置两批交易对比卡片。 -->
    <section class="mt-6 rounded-lg border border-slate-200 bg-white shadow-sm"> <!-- 放置单批次全股票复盘区域。 -->
      <div class="flex flex-col gap-3 border-b border-slate-200 px-4 py-3 lg:flex-row lg:items-center lg:justify-between"> <!-- 设置复盘标题栏和批次切换按钮。 -->
        <div> <!-- 包裹复盘标题和说明。 -->
          <h2 class="text-base font-semibold text-slate-950">批次全股票买卖复盘</h2> <!-- 显示单批次全股票复盘标题。 -->
          <p id="batchReviewSummary" class="mt-1 text-sm text-slate-500">批次复盘加载中</p> <!-- 显示当前批次的收益和股票数量摘要。 -->
        </div> <!-- 结束复盘标题容器。 -->
        <div class="flex flex-wrap gap-2" id="batchReviewFilters"></div> <!-- 放置批次切换按钮。 -->
      </div> <!-- 结束复盘标题栏。 -->
      <div id="batchStockGrid" class="grid gap-4 p-4 xl:grid-cols-2"></div> <!-- 放置当前批次所有股票的价格和成交量小图。 -->
    </section> <!-- 结束单批次全股票复盘区域。 -->
    <section class="mt-6 rounded-lg border border-slate-200 bg-white shadow-sm"> <!-- 放置板块收益归因区域。 -->
      <div class="border-b border-slate-200 px-4 py-3"> <!-- 设置板块标题栏。 -->
        <h2 class="text-base font-semibold text-slate-950">板块收益归因</h2> <!-- 显示板块收益标题。 -->
      </div> <!-- 结束板块标题栏。 -->
      <div id="boardCards" class="grid gap-4 p-4 lg:grid-cols-2"></div> <!-- 按批次放置中证1000和科创板收益卡片。 -->
    </section> <!-- 结束板块收益归因区域。 -->
    <section class="mt-6 rounded-lg border border-slate-200 bg-white shadow-sm"> <!-- 放置交易时间轴图表区域。 -->
      <div class="flex flex-col gap-3 border-b border-slate-200 px-4 py-3 lg:flex-row lg:items-center lg:justify-between"> <!-- 设置图表标题栏和筛选区。 -->
        <div> <!-- 包裹图表标题和时间范围。 -->
          <h2 class="text-base font-semibold text-slate-950">交易价格时间轴</h2> <!-- 显示价格时间轴标题。 -->
          <p id="timelineRange" class="mt-1 text-sm text-slate-500">时间范围：加载中</p> <!-- 显示时间轴时间范围。 -->
        </div> <!-- 结束图表标题容器。 -->
        <div class="flex flex-wrap gap-2" id="timelineFilters"></div> <!-- 放置批次筛选按钮。 -->
      </div> <!-- 结束图表标题栏。 -->
      <div class="px-4 py-4"> <!-- 设置图表主体内边距。 -->
        <div id="timelineChart" class="overflow-x-auto"></div> <!-- 放置 SVG 时间轴图表。 -->
        <div id="timelineLegend" class="mt-3 flex flex-wrap gap-3 text-xs text-slate-600"></div> <!-- 放置图例。 -->
      </div> <!-- 结束图表主体。 -->
    </section> <!-- 结束交易时间轴图表区域。 -->
    <section class="mt-6 rounded-lg border border-slate-200 bg-white shadow-sm"> <!-- 放置时间轴事件明细区域。 -->
      <div class="border-b border-slate-200 px-4 py-3"> <!-- 设置事件表格标题栏。 -->
        <h2 class="text-base font-semibold text-slate-950">时间轴事件明细</h2> <!-- 显示事件明细标题。 -->
      </div> <!-- 结束事件表格标题栏。 -->
      <div class="overflow-x-auto"> <!-- 设置事件表格横向滚动。 -->
        <table class="min-w-full border-collapse text-left"> <!-- 创建事件明细表格。 -->
          <thead class="bg-slate-50 text-xs uppercase text-slate-500"> <!-- 设置事件明细表头样式。 -->
            <tr> <!-- 开始事件明细表头行。 -->
              <th class="px-3 py-3">时间</th> <!-- 显示时间列标题。 -->
              <th class="px-3 py-3">批次</th> <!-- 显示批次列标题。 -->
              <th class="px-3 py-3">股票</th> <!-- 显示股票列标题。 -->
              <th class="px-3 py-3">事件</th> <!-- 显示事件列标题。 -->
              <th class="px-3 py-3 text-right">数量</th> <!-- 显示数量列标题。 -->
              <th class="px-3 py-3 text-right">价格</th> <!-- 显示价格列标题。 -->
              <th class="px-3 py-3 text-right">金额</th> <!-- 显示金额列标题。 -->
              <th class="px-3 py-3 text-right">收益率</th> <!-- 显示收益率列标题。 -->
              <th class="px-3 py-3">状态</th> <!-- 显示状态列标题。 -->
              <th class="px-3 py-3">来源</th> <!-- 显示来源列标题。 -->
            </tr> <!-- 结束事件明细表头行。 -->
          </thead> <!-- 结束事件明细表头。 -->
          <tbody id="timelineRows" class="divide-y divide-slate-100"></tbody> <!-- 放置事件明细表格行。 -->
        </table> <!-- 结束事件明细表格。 -->
      </div> <!-- 结束事件表格滚动容器。 -->
    </section> <!-- 结束时间轴事件明细区域。 -->
    <section class="mt-6 rounded-lg border border-slate-200 bg-white shadow-sm"> <!-- 放置持仓和计划明细区域。 -->
      <div class="border-b border-slate-200 px-4 py-3"> <!-- 设置表格标题栏。 -->
        <h2 class="text-base font-semibold text-slate-950">持仓与计划明细</h2> <!-- 显示持仓计划标题。 -->
      </div> <!-- 结束表格标题栏。 -->
      <div class="overflow-x-auto"> <!-- 设置横向滚动，避免小屏幕表格溢出。 -->
        <table class="min-w-full border-collapse text-left"> <!-- 创建持仓明细表格。 -->
          <thead class="bg-slate-50 text-xs uppercase text-slate-500"> <!-- 设置持仓明细表头样式。 -->
            <tr> <!-- 开始持仓明细表头行。 -->
              <th class="px-3 py-3">批次</th> <!-- 显示批次列标题。 -->
              <th class="px-3 py-3">板块</th> <!-- 显示板块列标题。 -->
              <th class="px-3 py-3">代码</th> <!-- 显示代码列标题。 -->
              <th class="px-3 py-3">状态</th> <!-- 显示状态列标题。 -->
              <th class="px-3 py-3 text-right">买入股数</th> <!-- 显示买入股数列标题。 -->
              <th class="px-3 py-3 text-right">买入均价</th> <!-- 显示买入均价列标题。 -->
              <th class="px-3 py-3 text-right">目标价</th> <!-- 显示目标价列标题。 -->
              <th class="px-3 py-3 text-right">卖出股数</th> <!-- 显示卖出股数列标题。 -->
              <th class="px-3 py-3 text-right">卖出均价</th> <!-- 显示卖出均价列标题。 -->
              <th class="px-3 py-3 text-right">剩余股数</th> <!-- 显示剩余股数列标题。 -->
              <th class="px-3 py-3 text-right">剩余市值</th> <!-- 显示剩余市值列标题。 -->
              <th class="px-3 py-3 text-right">合计结果</th> <!-- 显示单票结果列标题。 -->
              <th class="px-3 py-3 text-right">收益率</th> <!-- 显示单票收益率列标题。 -->
            </tr> <!-- 结束持仓明细表头行。 -->
          </thead> <!-- 结束持仓明细表头。 -->
          <tbody id="positionRows" class="divide-y divide-slate-100"></tbody> <!-- 放置持仓明细表格行。 -->
        </table> <!-- 结束持仓明细表格。 -->
      </div> <!-- 结束横向滚动容器。 -->
    </section> <!-- 结束持仓和计划明细区域。 -->
    <section class="mt-6 rounded-lg border border-slate-200 bg-white shadow-sm"> <!-- 放置今日委托明细区域。 -->
      <div class="border-b border-slate-200 px-4 py-3"> <!-- 设置今日委托标题栏。 -->
        <h2 class="text-base font-semibold text-slate-950">今日委托明细</h2> <!-- 显示今日委托标题。 -->
      </div> <!-- 结束今日委托标题栏。 -->
      <div class="overflow-x-auto"> <!-- 设置委托表格横向滚动。 -->
        <table class="min-w-full border-collapse text-left"> <!-- 创建今日委托表格。 -->
          <thead class="bg-slate-50 text-xs uppercase text-slate-500"> <!-- 设置今日委托表头样式。 -->
            <tr> <!-- 开始今日委托表头行。 -->
              <th class="px-3 py-3">批次</th> <!-- 显示委托批次列标题。 -->
              <th class="px-3 py-3">代码</th> <!-- 显示委托代码列标题。 -->
              <th class="px-3 py-3">方向</th> <!-- 显示委托方向列标题。 -->
              <th class="px-3 py-3 text-right">委托号</th> <!-- 显示委托号列标题。 -->
              <th class="px-3 py-3 text-right">委托量</th> <!-- 显示委托量列标题。 -->
              <th class="px-3 py-3 text-right">成交量</th> <!-- 显示成交量列标题。 -->
              <th class="px-3 py-3">状态</th> <!-- 显示委托状态列标题。 -->
              <th class="px-3 py-3 text-right">委托价</th> <!-- 显示委托价列标题。 -->
            </tr> <!-- 结束今日委托表头行。 -->
          </thead> <!-- 结束今日委托表头。 -->
          <tbody id="orderRows" class="divide-y divide-slate-100"></tbody> <!-- 放置今日委托表格行。 -->
        </table> <!-- 结束今日委托表格。 -->
      </div> <!-- 结束委托表格横向滚动容器。 -->
    </section> <!-- 结束今日委托明细区域。 -->
  </main> <!-- 结束页面主体。 -->
  <script src="./trade_snapshot.js"></script> <!-- 加载交易快照数据脚本。 -->
  <script src="./app.js"></script> <!-- 加载看板渲染脚本。 -->
</body> <!-- 结束页面主体标签。 -->
</html> <!-- 结束 HTML 文档。 -->
